[build]
  command = "npx prisma generate"
  publish = "public"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  # Exclude Prisma from bundling — needs native binaries at runtime
  [functions.api]
    external_node_modules = ["@prisma/client", ".prisma"]

# Route all requests to the Express function
[[redirects]]
  from = "/*"
  to = "/.netlify/functions/api"
  status = 200
  force = true
